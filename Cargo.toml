[package]
name = "harugate"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local OpenRouter provider-routing proxy for Koharu"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nibelought/harugate"
readme = "README.md"
keywords = ["openrouter", "proxy", "koharu", "llm"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.105"
axum = "0.8"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time"] }
toml = "1.2.3"
toml_edit = "0.25.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webbrowser = "1.2.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
