# harugate config: a commented sample of every key. harugate writes a similar file on first run
# (see the README for where). Every key is optional; `routing` and the pin below are examples,
# not defaults.

listen = "127.0.0.1:8787"                 # N1: loopback by default
upstream = "https://openrouter.ai/api/v1"

# Global sort for models with no pin: "price" | "throughput" | "latency".
# Omit for Balanced (OpenRouter's default).
routing = "price"

# Only hosts that support every parameter the request sends (Koharu's default for OpenRouter).
require_parameters = true

# Model id (as Koharu sends it, OpenRouter's author/slug) -> endpoint tag.
# Find tags with: harugate hosts <author/slug>
[pins]
"deepseek/deepseek-v4.1-flash-1017" = "deepinfra/fp8"
